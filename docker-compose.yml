services:
  mensagelo:
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: mensagelo/Dockerfile
    image: comunic-mon-mensagelo:1.0.0
    container_name: comunic-mon-mensagelo
    hostname: mensagelo
    env_file:
      - .env
    environment:
      DATABASE_DIR: ${MENSAGELO_DATABASE_DIR}
      DATABASE_NAME: ${MENSAGELO_DATABASE_NAME}
      QUEUE_MAXSIZE: ${MENSAGELO_QUEUE_MAXSIZE}
      API_KEY: ${MENSAGELO_API_KEY}
      SMTP_SERVER: ${SMTP_SERVER}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS}
    volumes:
      - ./volumes/mensagelo:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - backend

  panelexemys:
    pids_limit: 256
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: .
      dockerfile: panelexemys/Dockerfile
      additional_contexts:
        frontend-foundation: ../../../platform/frontend-foundation
    image: comunic-mon-panelexemys:1.0.0
    container_name: comunic-mon-panelexemys
    depends_on:
      modbus-collector-service:
        condition: service_started
    env_file:
      - .env
    environment:
      MENSAGELO_BASE_URL: ${MENSAGELO_BASE_URL}
      API_KEY: ${MENSAGELO_API_KEY}
      CHARITO_API_BASE: ${CHARITO_API_BASE}
      PVE_API_BASE: ${PVE_API_BASE}
      MODBUS_COLLECTOR_API_BASE: ${MODBUS_COLLECTOR_API_BASE}
      MODBUS_COLLECTOR_HTTP_TIMEOUT: ${MODBUS_COLLECTOR_HTTP_TIMEOUT}
      MODBUS_HTTP_POLL_SECONDS: ${MODBUS_HTTP_POLL_SECONDS}
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT}
      MQTT_BROKER_USERNAME: ${MQTT_BROKER_USERNAME}
      MQTT_BROKER_PASSWORD: ${MQTT_BROKER_PASSWORD}
      MQTT_BROKER_KEEPALIVE: ${MQTT_BROKER_KEEPALIVE}
      MQTT_CONNECT_TIMEOUT: ${MQTT_CONNECT_TIMEOUT}
      MQTT_RECONNECT_DELAY_MIN: ${MQTT_RECONNECT_DELAY_MIN}
      MQTT_RECONNECT_DELAY_MAX: ${MQTT_RECONNECT_DELAY_MAX}
      MQTT_BROKER_USE_TLS: ${MQTT_BROKER_USE_TLS}
      MQTT_TLS_INSECURE: ${MQTT_TLS_INSECURE}
    volumes:
      - ./volumes/panelexemys:/app/data
    restart: unless-stopped
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8052:8052"
    networks:
      - backend
      - edge

  alarmero-service:
    pids_limit: 256
    logging: *default-logging
    build:
      context: .
      dockerfile: alarmero-service/Dockerfile
      additional_contexts:
        frontend-foundation: ../../../platform/frontend-foundation
    image: comunic-mon-alarmero-service:1.0.0
    container_name: comunic-mon-alarmero-service
    depends_on:
      panelexemys:
        condition: service_started
      mensagelo:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_DIR: ${ALARMERO_DATABASE_DIR}
      DATABASE_NAME: ${ALARMERO_DATABASE_NAME}
      PANELEXEMYS_BASE_URL: ${ALARMERO_PANELEXEMYS_BASE_URL}
      MENSAGELO_BASE_URL: ${ALARMERO_MENSAGELO_BASE_URL}
      SOURCE_API_KEY: ${MENSAGELO_API_KEY}
      HTTP_TIMEOUT_SECONDS: ${ALARMERO_HTTP_TIMEOUT_SECONDS}
      POLL_INTERVAL_SECONDS: ${ALARMERO_POLL_INTERVAL_SECONDS}
    volumes:
      - ./volumes/alarmero-service:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8094:8094"
    networks:
      - backend
      - edge

  charito-service:
    pids_limit: 256
    logging: *default-logging
    build:
      context: .
      dockerfile: charito-service/Dockerfile
    image: comunic-mon-charito-service:1.0.0
    container_name: comunic-mon-charito-service
    env_file:
      - .env
    environment:
      CHARITO_DATA_DIR: ${CHARITO_DATA_DIR}
      CHARITO_STATE_FILE: ${CHARITO_STATE_FILE}
      CHARITO_TARGETS_JSON: ${CHARITO_TARGETS_JSON}
      CHARITO_MQTT_STATE_TOPIC: ${CHARITO_MQTT_STATE_TOPIC}
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT}
      MQTT_BROKER_USERNAME: ${MQTT_BROKER_USERNAME}
      MQTT_BROKER_PASSWORD: ${MQTT_BROKER_PASSWORD}
      MQTT_BROKER_USE_TLS: ${MQTT_BROKER_USE_TLS}
      MQTT_TLS_INSECURE: ${MQTT_TLS_INSECURE}
      MQTT_BROKER_KEEPALIVE: ${MQTT_BROKER_KEEPALIVE}
    volumes:
      - ./volumes/charito-service:/app/data
    restart: unless-stopped
    networks:
      - backend

  pve-service:
    pids_limit: 256
    logging: *default-logging
    build:
      context: .
      dockerfile: pve-service/Dockerfile
    image: comunic-mon-pve-service:1.0.0
    container_name: comunic-mon-pve-service
    env_file:
      - .env
    environment:
      DATA_DIR: ${PVE_DATA_DIR}
      PVE_BASE_URL: ${PVE_BASE_URL}
      PVE_API_TOKEN: ${PVE_API_TOKEN}
      PVE_NODE_NAME: ${PVE_NODE_NAME}
      PVE_VHOST_IDS: ${PVE_VHOST_IDS}
      PVE_HTTP_TIMEOUT_SECONDS: ${PVE_HTTP_TIMEOUT_SECONDS}
      PVE_VERIFY_SSL: ${PVE_VERIFY_SSL}
      PVE_POLL_INTERVAL_SECONDS: ${PVE_POLL_INTERVAL_SECONDS}
      PVE_HISTORY_HOURS: ${PVE_HISTORY_HOURS}
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT}
      MQTT_BROKER_USERNAME: ${MQTT_BROKER_USERNAME}
      MQTT_BROKER_PASSWORD: ${MQTT_BROKER_PASSWORD}
      MQTT_BROKER_USE_TLS: ${MQTT_BROKER_USE_TLS}
      MQTT_TLS_INSECURE: ${MQTT_TLS_INSECURE}
      PVE_STATE_FILE: ${PVE_STATE_FILE}
      PVE_HISTORY_FILE: ${PVE_HISTORY_FILE}
    volumes:
      - ./volumes/pve-service:/app/data
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8083"
    networks:
      - backend
      - edge

  modbus-collector-service:
    pids_limit: 256
    stop_grace_period: 30s
    logging: *default-logging
    build:
      context: .
      dockerfile: modbus-collector-service/Dockerfile
    image: comunic-mon-modbus-collector-service:1.0.0
    container_name: comunic-mon-modbus-collector-service
    env_file:
      - .env
    environment:
      MODBUS_COLLECTOR_MW_EXEMYS_MB_HOST: ${MODBUS_COLLECTOR_MW_EXEMYS_MB_HOST}
      MODBUS_COLLECTOR_MW_EXEMYS_MB_PORT: ${MODBUS_COLLECTOR_MW_EXEMYS_MB_PORT}
      MODBUS_COLLECTOR_MW_EXEMYS_MB_ID: ${MODBUS_COLLECTOR_MW_EXEMYS_MB_ID}
      MODBUS_COLLECTOR_MW_EXEMYS_MB_COUNT: ${MODBUS_COLLECTOR_MW_EXEMYS_MB_COUNT}
      MODBUS_COLLECTOR_MW_EXEMYS_MB_INTERVAL_SECONDS: ${MODBUS_COLLECTOR_MW_EXEMYS_MB_INTERVAL_SECONDS}
      MODBUS_COLLECTOR_GRD_FAILURE_THRESHOLD: ${MODBUS_COLLECTOR_GRD_FAILURE_THRESHOLD}
      MODBUS_RELAY_LATEST_FAULT_ADDRESS: ${MODBUS_RELAY_LATEST_FAULT_ADDRESS}
      MODBUS_RELAY_FAULT_REGISTER_COUNT: ${MODBUS_RELAY_FAULT_REGISTER_COUNT}
      MODBUS_COLLECTOR_EDIF_FONTANA_MB_HOST: ${MODBUS_COLLECTOR_EDIF_FONTANA_MB_HOST}
      MODBUS_COLLECTOR_EDIF_FONTANA_MB_PORT: ${MODBUS_COLLECTOR_EDIF_FONTANA_MB_PORT}
      MODBUS_COLLECTOR_EDIF_FONTANA_MB_ID: ${MODBUS_COLLECTOR_EDIF_FONTANA_MB_ID}
      MODBUS_COLLECTOR_DATA_DIR: ${MODBUS_COLLECTOR_DATA_DIR}
      MODBUS_COLLECTOR_DATABASE_NAME: ${MODBUS_COLLECTOR_DATABASE_NAME}
      EDIF_ESTIVARIZ_GE_GRD_ID: ${EDIF_ESTIVARIZ_GE_GRD_ID}
      EDIF_ESTIVARIZ_GE_REGISTER_OFFSET: ${EDIF_ESTIVARIZ_GE_REGISTER_OFFSET}
      EDIF_ESTIVARIZ_GE_LINE_BIT_INDEX: ${EDIF_ESTIVARIZ_GE_LINE_BIT_INDEX}
      EDIF_ESTIVARIZ_GE_GENERATOR_BIT_INDEX: ${EDIF_ESTIVARIZ_GE_GENERATOR_BIT_INDEX}
      EDIF_ESTIVARIZ_GE_TOPIC: ${EDIF_ESTIVARIZ_GE_TOPIC}
      EDIF_FONTANA_GE_REGISTER_OFFSET: ${EDIF_FONTANA_GE_REGISTER_OFFSET}
      EDIF_FONTANA_GE_REGISTER_COUNT: ${EDIF_FONTANA_GE_REGISTER_COUNT}
      EDIF_FONTANA_GE_LINE_BIT_INDEX: ${EDIF_FONTANA_GE_LINE_BIT_INDEX}
      EDIF_FONTANA_GE_GENERATOR_BIT_INDEX: ${EDIF_FONTANA_GE_GENERATOR_BIT_INDEX}
      EDIF_FONTANA_GE_INTERVAL_SECONDS: ${EDIF_FONTANA_GE_INTERVAL_SECONDS}
      EDIF_FONTANA_GE_TOPIC: ${EDIF_FONTANA_GE_TOPIC}
      MQTT_BROKER_HOST: ${MQTT_BROKER_HOST}
      MQTT_BROKER_PORT: ${MQTT_BROKER_PORT}
      MQTT_BROKER_USERNAME: ${MQTT_BROKER_USERNAME}
      MQTT_BROKER_PASSWORD: ${MQTT_BROKER_PASSWORD}
      MQTT_BROKER_USE_TLS: ${MQTT_BROKER_USE_TLS}
      MQTT_TLS_INSECURE: ${MQTT_TLS_INSECURE}
      MQTT_BROKER_KEEPALIVE: ${MQTT_BROKER_KEEPALIVE}
      MQTT_PUBLISH_TIMEOUT_SECONDS: ${MQTT_PUBLISH_TIMEOUT_SECONDS}
    volumes:
      - ./volumes/modbus-collector-service:/app/data
    restart: unless-stopped
    tmpfs:
      - /tmp
    ports:
      - "127.0.0.1:8084:8084"
    networks:
      - backend
      - edge

  modem-link-monitor:
    pids_limit: 256
    logging: *default-logging
    build:
      context: .
      dockerfile: modem-link-monitor/Dockerfile
    image: comunic-mon-modem-link-monitor:1.0.0
    container_name: comunic-mon-modem-link-monitor
    env_file:
      - .env
    ports:
      - "127.0.0.1:8086:8086"
    restart: unless-stopped
    networks:
      - backend
      - edge

name: comunic-mon

networks:
  backend:
    name: comunic-mon-backend-net
    driver: bridge
  edge:
    name: servicoop-edge-net
    external: true

